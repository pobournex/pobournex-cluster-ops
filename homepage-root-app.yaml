apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage-gitops
  namespace: argocd
spec:
  project: default
  source:
    # REPLACE with your actual repo URL
    repoURL: https://github.com/pobournex/pobournex-cluster-ops.git
    targetRevision: HEAD
    path: apps/homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true     # Automatically delete resources removed from Git
      selfHeal: true  # Automatically fix changes made manually via kubectl
    syncOptions:
    - CreateNamespace=true # Tells ArgoCD to create the 'homepage' namespace if it's missing
