apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  # 1. Main Dashboard Settings
  settings.yaml: |
    title: "Pobournex Cloud"
    base: https://homepage.pobournex.com
    # Professional layout for SRE dashboards
    layout:
      Infrastructure:
        style: row
        columns: 4
      Services:
        style: row
        columns: 4

  # 2. Infrastructure & Monitoring Links
  services.yaml: |
    - Infrastructure:
        - Traefik:
            icon: traefik.png
            href: https://traefik.pobournex.com
            description: Reverse Proxy & Ingress
              # - ArgoCD:
              # icon: argocd.png
              # href: https://argocd.pobournex.com
              # descrip

        - ArgoCD:
            icon: argocd.png
            href: https://argocd.pobournex.com
            description: GitOps Continuous Delivery
  # Use your Argo IP
            # If you have an 'api' section below, that's likely causing the 'API Error'
            # widget:
            #   type: argocd
            #   url: http://192.168.40.150
            #   password: yourpassword
        - Grafana:
            icon: grafana.png
            href: https://grafana.pobournex.com
            description: Metrics & Observability
    - Services:
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.pobournex.com
            description: Private Cloud Storage
   - Services:
    - Uptime Kuma:
        icon: uptime-kuma
        href: http://192.168.40.103
        description: Infrastructure Monitoring
        widget:
          type: uptimekuma
          url: http://192.168.40.103

  # 3. Quick Links
  bookmarks.yaml: |
    - Documentation:
        - GitHub:
            - abbr: GH
              href: https://github.com/pobournex
        - Kubernetes Docs:
            - abbr: K8s
              href: https://kubernetes.io/docs/

  # 4. Live Cluster Stats (The SRE "Flex")
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
        nodes:
          show: true
    - datetime:
        format:
          dateStyle: short
          timeStyle: short

  # 5. K8s Connection (Enables the widgets above)
  kubernetes.yaml: |
    mode: cluster
