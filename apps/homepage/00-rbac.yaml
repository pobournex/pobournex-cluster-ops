apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage-sa
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-k8s-reader
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"] # <--- Add this section
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-read-binding
subjects:
- kind: ServiceAccount
  name: homepage-sa
  namespace: homepage
roleRef:
  kind: ClusterRole
  name: homepage-k8s-reader
  apiGroup: rbac.authorization.k8.io
